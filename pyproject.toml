[project]
name = "atwood"
version = "0.1.1"
description = "Every place has a story"
readme = "README.md"
authors = [
    { name = "rodrigodub", email = "nobrega@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
