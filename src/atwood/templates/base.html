<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Keyboard Odyssey{% endblock %}</title>
  <!-- Bootstrap CSS -->
<!-- In your <head> -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
{#<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">#}
<link href="{{ url_for('static', path='main/css/bootstrap.min.css') }}" rel="stylesheet">
<link href="{{ url_for('static', path='main/css/custom.css') }}?v={{ app_version }}" rel="stylesheet">
  {% block head_extra %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-light shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand" href="{{ url_for('home') }}">
        Atwood
        <small class="text-muted" style="font-size: 0.6rem; vertical-align: middle;">v{{ app_version }}</small>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navbarNav" aria-controls="navbarNav"
              aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
         <li class="nav-item">
           <a class="nav-link" href="{{ url_for('home') }}">Home</a>
         </li>
       </ul>
       {% block navbar_controls %}{% endblock %}
     </div>
   </div>
 </nav>
 <div class="config-panel-anchor">
   {% block navbar_panel %}{% endblock %}
 </div>

 <!-- Main Body -->
 <div class="{% block container_class %}container{% endblock %}">
   {% block content %}{% endblock %}
 </div>

 <!-- Bootstrap JS -->
{#  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>#}
 <script src="{{ url_for('static', path='main/js/bootstrap.bundle.min.js') }}"></script>
 {% block extra_js %}{% endblock %}

</body>
</html>
